<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Maestro: AI Lab</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155'
                        },
                        brand: {
                            red: '#dc2626',
                            'red-hover': '#b91c1c'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-navy-900 text-slate-100 font-sans min-h-screen flex flex-col md:flex-row antialiased">

    <!-- Toast Notification System Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

    <!-- Sidebar / Configuration Panel -->
    <aside class="w-full md:w-80 bg-navy-800 border-r border-slate-700/50 p-6 flex flex-col gap-6 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-brand-red p-2.5 rounded-xl text-white shadow-lg shadow-red-900/40">
                <i class="fa-solid fa-microphone-lines text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide">Speaking Maestro</h1>
                <span class="text-xs font-semibold text-brand-red tracking-wider uppercase">Pro Studio</span>
            </div>
        </div>

        <hr class="border-slate-700/50">

        <!-- Authentication -->
        <div class="flex flex-col gap-3">
            <label class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                <i class="fa-solid fa-key"></i> Authentication
            </label>
            <div class="relative">
                <input type="password" id="apiKey" placeholder="Gemini API Key" class="w-full bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-red transition">
            </div>
            <button id="saveKeyBtn" onclick="saveApiKey()" class="w-full bg-slate-100 hover:bg-white text-navy-900 font-semibold py-2 rounded-lg text-sm transition shadow">
                Save Key
            </button>
            <button id="refreshModelsBtn" onclick="fetchModels()" class="w-full bg-navy-900 border border-slate-700 hover:bg-slate-700 text-slate-200 font-medium py-2 rounded-lg text-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-rotate text-xs"></i> Refresh Models
            </button>
        </div>

        <hr class="border-slate-700/50">

        <!-- ESL Configuration -->
        <div class="flex flex-col gap-4">
            <label class="text-xs font-bold text-slate-400 tracking-wider uppercase flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> ESL Configuration
            </label>
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-300">AI Model</label>
                <select id="modelSelect" class="bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-red transition text-slate-200">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-300">Target Proficiency</label>
                <select id="levelSelect" class="bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-red transition text-slate-200">
                    <option value="A1">A1 - Beginner</option>
                    <option value="A2" selected>A2 - Elementary</option>
                    <option value="B1">B1 - Intermediate</option>
                    <option value="B2">B2 - Upper Intermediate</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-slate-300">Context / Topic</label>
                <select id="topicSelect" class="bg-navy-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-red transition text-slate-200">
                    <option value="General Conversation">General Conversation</option>
                    <option value="Past Simple Experiences">Past Simple / Life Story</option>
                    <option value="Future Plans & Goals">Future Plans & Dreams</option>
                    <option value="Job Interview Simulation">Job Interview Simulation</option>
                    <option value="Debate & Opinions">Debate & Formal Opinions</option>
                </select>
            </div>
        </div>

        <div class="mt-auto text-xs text-slate-500 text-center">
            Speaking Maestro AI Lab &copy; v1beta
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 md:p-8 flex flex-col gap-6 overflow-y-auto">
        <!-- Header bar -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h2 class="text-2xl font-bold">Evaluation Studio</h2>
                <p class="text-sm text-slate-400">Real-time linguistic feedback engine</p>
            </div>
            <div id="statusBadge" class="bg-emerald-900/30 text-emerald-400 border border-emerald-800 text-xs px-3 py-1 rounded-full font-medium flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ready
            </div>
        </header>

        <!-- Studio Layout: Recorder + Report -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1">
            
            <!-- Left Side: Recorder Card -->
            <div class="bg-navy-800/60 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between items-center min-h-[380px] shadow-xl">
                <div class="text-center">
                    <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Session Recorder</span>
                    <div id="timerDisplay" class="text-4xl font-extrabold my-2 tracking-tight text-slate-200">00:00</div>
                    <span class="text-xs text-slate-500">Recommended: 15s - 60s</span>
                </div>

                <!-- Circular Recording Button -->
                <div class="relative my-6 flex items-center justify-center">
                    <button id="recordBtn" onclick="toggleRecording()" class="w-28 h-28 rounded-full bg-brand-red hover:bg-brand-red-hover text-white flex flex-col items-center justify-center gap-1 shadow-lg shadow-red-900/50 transition-all duration-300">
                        <i id="recordIcon" class="fa-solid fa-microphone text-3xl"></i>
                        <span id="recordText" class="text-xs font-bold uppercase tracking-wider">Start</span>
                    </button>
                </div>

                <!-- Audio Review & Actions -->
                <div class="w-full flex flex-col gap-4 items-center">
                    <audio id="audioPlayback" controls class="w-full hidden h-10 rounded-lg"></audio>
                    <button id="analyzeBtn" onclick="processAndAnalyze()" disabled class="w-full bg-brand-red hover:bg-brand-red-hover disabled:bg-slate-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Run AI Analysis
                    </button>
                </div>
            </div>

            <!-- Right Side: Analysis Report Card -->
            <div class="bg-navy-800/60 border border-slate-800 rounded-2xl p-6 flex flex-col shadow-xl relative overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-700/50 pb-3 mb-4">
                    <h3 class="font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-file-lines text-brand-red"></i> Analysis Report
                    </h3>
                    <button onclick="copyReport()" title="Copy Report" class="text-slate-400 hover:text-white transition">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <!-- Report Content Area -->
                <div id="reportContainer" class="flex-1 overflow-y-auto pr-2 flex flex-col justify-center items-center text-center text-slate-500 gap-3">
                    <i class="fa-solid fa-wave-square text-4xl opacity-30"></i>
                    <p class="text-sm max-w-xs">Complete a recording to generate your speaking profile.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // --- State Management ---
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let recordingTimer;
        let secondsElapsed = 0;
        let isRecording = false;

        // --- Toast Notification System ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColors = {
                success: 'bg-emerald-900/90 border-emerald-500 text-emerald-200',
                error: 'bg-red-900/90 border-red-500 text-red-200',
                warning: 'bg-amber-900/90 border-amber-500 text-amber-200',
                info: 'bg-navy-800/90 border-slate-600 text-slate-200'
            };

            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-xmark text-red-400',
                warning: 'fa-triangle-exclamation text-amber-400',
                info: 'fa-circle-info text-blue-400'
            };

            toast.className = `pointer-events-auto border backdrop-blur-md px-4 py-3 rounded-xl shadow-xl text-sm flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-[-10px] opacity-0 ${bgColors[type] || bgColors.info}`;
            
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fa-solid ${icons[type]} text-base"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-10px]', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- API Key & Model Management ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                showToast('API Key loaded from memory', 'success');
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) {
                showToast('Please enter a valid API Key', 'warning');
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            showToast('API Key saved successfully', 'success');
        }

        async function fetchModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('Please set your API Key first', 'warning');
                return;
            }

            try {
                showToast('Fetching available models...', 'info');
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const data = await response.json();
                const select = document.getElementById('modelSelect');
                select.innerHTML = '';

                // Filter generateContent compatible models
                const validModels = (data.models || []).filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));

                if (validModels.length === 0) {
                    showToast('No multimodal models found for this key', 'warning');
                    return;
                }

                validModels.forEach(m => {
                    const cleanName = m.name.replace('models/', '');
                    const option = document.createElement('option');
                    option.value = cleanName;
                    option.textContent = m.displayName || cleanName;
                    select.appendChild(option);
                });

                showToast(`Loaded ${validModels.length} models`, 'success');
            } catch (err) {
                console.error(err);
                showToast('Failed to fetch models: ' + err.message, 'error');
            }
        }

        // --- Audio Recording Controls ---
        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const player = document.getElementById('audioPlayback');
                        player.src = audioUrl;
                        player.classList.remove('hidden');
                        document.getElementById('analyzeBtn').disabled = false;
                        showToast('Recording ready for analysis', 'success');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    startTimer();

                    // UI Changes
                    const btn = document.getElementById('recordBtn');
                    btn.classList.add('recording-pulse');
                    document.getElementById('recordIcon').className = 'fa-solid fa-stop text-3xl';
                    document.getElementById('recordText').innerText = 'Stop';
                    updateStatus('Recording audio...', 'red');

                } catch (err) {
                    showToast('Microphone access denied or error: ' + err.message, 'error');
                }
            } else {
                mediaRecorder.stop();
                // Stop media tracks
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                stopTimer();

                // UI Reset
                const btn = document.getElementById('recordBtn');
                btn.classList.remove('recording-pulse');
                document.getElementById('recordIcon').className = 'fa-solid fa-microphone text-3xl';
                document.getElementById('recordText').innerText = 'Start';
                updateStatus('Ready', 'emerald');
            }
        }

        function startTimer() {
            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = '00:00';
            recordingTimer = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(recordingTimer);
        }

        function updateStatus(text, color) {
            const badge = document.getElementById('statusBadge');
            badge.className = `bg-${color}-900/30 text-${color}-400 border border-${color}-800 text-xs px-3 py-1 rounded-full font-medium flex items-center gap-1.5`;
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-${color}-500"></span> ${text}`;
        }

        // --- Helper: Convert Blob to Base64 ---
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64data = reader.result.split(',')[1];
                    resolve(base64data);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // --- Retry Fetch Logic ---
        async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (response.status === 503 || response.status === 429) {
                    if (retries > 0) {
                        showToast(`Server busy (${response.status}). Retrying in ${backoff/1000}s...`, 'warning');
                        await new Promise(res => setTimeout(res, backoff));
                        return fetchWithRetry(url, options, retries - 1, backoff * 2);
                    }
                }
                return response;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        // --- Gemini API Processing ---
        async function processAndAnalyze() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showToast('Missing Gemini API Key', 'error');
                return;
            }
            if (!audioBlob) {
                showToast('Please record audio first', 'warning');
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const level = document.getElementById('levelSelect').value;
            const topic = document.getElementById('topicSelect').value;

            // Prepare UI state
            const analyzeBtn = document.getElementById('analyzeBtn');
            const reportContainer = document.getElementById('reportContainer');
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Analyzing...`;
            updateStatus('AI Processing', 'amber');

            reportContainer.className = "flex-1 overflow-y-auto pr-2 flex flex-col justify-center items-center text-center text-slate-400 gap-3";
            reportContainer.innerHTML = `
                <i class="fa-solid fa-brain text-4xl text-brand-red animate-pulse"></i>
                <p class="text-sm">Evaluating speech mechanics, grammar, and fluency...</p>
            `;

            try {
                const base64Audio = await blobToBase64(audioBlob);

                const systemInstruction = `You are a Senior IELTS/TOEFL ESL Examiner. Analyze the candidate's audio based on their CEFR target level (${level}) and current topic context (${topic}).
Provide structured, constructive feedback using EXACTLY the following Markdown structure:

[SCORE: X/10]

### 📝 Transcript
<Write an accurate transcription of the user's speech here>

### 🗣️ Pronunciation & Fluency
<Analyze clarity, pace, pauses, and sound articulation>

### 📚 Grammar & Vocabulary
<Identify strengths, structural errors, and better word choices>

### 💡 Pedagogical Recommendation (${level})
<Give 1 clear, actionable technique tailored specifically for an ${level} learner to improve performance in ${topic}>`;

                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [
                        {
                            role: "user",
                            parts: [
                                { text: systemInstruction },
                                {
                                    inlineData: {
                                        mimeType: "audio/mp3",
                                        data: base64Audio
                                    }
                                }
                            ]
                        }
                    ]
                };

                const response = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No evaluation output generated.";

                renderReport(rawText);
                showToast('Analysis completed!', 'success');
                updateStatus('Ready', 'emerald');

            } catch (err) {
                console.error(err);
                showToast('Analysis failed: ' + err.message, 'error');
                reportContainer.innerHTML = `
                    <i class="fa-solid fa-circle-exclamation text-4xl text-red-500"></i>
                    <p class="text-sm text-red-400">${err.message}</p>
                `;
                updateStatus('Error', 'red');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Run AI Analysis`;
            }
        }

        // --- Render Clean HTML Report ---
        function renderReport(markdownText) {
            const container = document.getElementById('reportContainer');
            container.className = "flex-1 overflow-y-auto pr-2 flex flex-col gap-4 text-left text-slate-200 text-sm";

            // Extract Score if present
            let scoreMatch = markdownText.match(/\[SCORE:\s*(\d+(\.\d+)?)\/10\]/i);
            let scoreHtml = '';
            if (scoreMatch) {
                const score = scoreMatch[1];
                scoreHtml = `
                    <div class="flex items-center justify-between bg-navy-900 border border-slate-700 p-3 rounded-xl">
                        <span class="font-bold text-slate-400 uppercase text-xs tracking-wider">Overall Band Score</span>
                        <span class="text-2xl font-extrabold text-brand-red">${score} <span class="text-xs text-slate-500">/ 10</span></span>
                    </div>
                `;
                markdownText = markdownText.replace(/\[SCORE:\s*\d+(\.\d+)?\/10\]/i, '');
            }

            // Simple Markdown parser formatting
            let htmlContent = markdownText
                .replace(/### (.*)/g, '<h4 class="font-bold text-brand-red text-base mt-2 mb-1 flex items-center gap-2">$1</h4>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>')
                .replace(/\n\n/g, '<br><br>');

            container.innerHTML = scoreHtml + `<div class="leading-relaxed text-slate-300">${htmlContent}</div>`;
        }

        function copyReport() {
            const container = document.getElementById('reportContainer');
            if (container.innerText) {
                navigator.clipboard.writeText(container.innerText);
                showToast('Report copied to clipboard', 'info');
            }
        }
    </script>
</body>
</html>
